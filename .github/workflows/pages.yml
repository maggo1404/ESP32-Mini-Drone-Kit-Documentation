name: Pages

on:
  push:
    branches: [ main ]
  pull_request:          # build only (docs merge check), no deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  build-docs:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - name: Install MkDocs
        run: pip install -r docs-site/requirements.txt
      - name: Build docs
        run: mkdocs build --strict -f docs-site/mkdocs.yml   # -> site/
      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          path: firmware-artifacts   # firmware-artifacts/firmware-<target>/*.bin
      - name: Place firmware and generate manifests
        run: |
          set -euo pipefail
          for target in xw-z1 xw-z1-c3 xw-z1-s3 flix-esp32; do
            mkdir -p "site/firmware/$target"
            cp "firmware-artifacts/firmware-$target/"flix.ino*.bin "site/firmware/$target/"
          done
          python3 docs-site/scripts/make_manifests.py --site-dir site --version "${GITHUB_SHA::7}"
      - name: Verify site contents
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/en/index.html
          test -f site/flasher/index.html
          test -f site/en/flasher/index.html
          test -f site/version.txt
          for target in xw-z1 xw-z1-c3 xw-z1-s3 flix-esp32; do
            test -f "site/firmware/manifest-$target.json"
            for f in flix.ino.merged.bin flix.ino.bin flix.ino.bootloader.bin flix.ino.partitions.bin; do
              test -s "site/firmware/$target/$f"
            done
          done
          find site/firmware -type f | sort
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
