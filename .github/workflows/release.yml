name: Release

# On v* tags: build all firmware targets (via firmware.yml) and publish a
# GitHub Release with the merged flash images attached.
# Kept separate from firmware.yml so that firmware.yml can be called with
# read-only permissions (e.g. from pages.yml).

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  release:
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        pattern: firmware-*
        path: artifacts
    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        mkdir release
        for d in artifacts/firmware-*; do
          target="${d#artifacts/firmware-}"
          cp "$d/flix.ino.merged.bin" "release/flix-${target}-${TAG}.merged.bin"
        done
        ls -l release
        gh release create "$TAG" release/* --repo "$REPO" --title "$TAG" --generate-notes \
          --notes "Merged images: flash at address 0x0 (e.g. with esptool or a web flasher)."
